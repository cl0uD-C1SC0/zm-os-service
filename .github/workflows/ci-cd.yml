# CI/CD do microsserviço (mesmo arquivo nos 4 repositórios: tudo vem do nome do repo).
#
#   test   (ubuntu-latest)        pytest + cobertura (falha se < 80%)
#   build  (ubuntu-latest)        docker build; push no Docker Hub só na main
#   deploy (self-hosted, zm-vm)   kubectl apply -f k8s/ no minikube da VM; só na main
#
# Imagem:     jayakuza/<repo>:<sha do commit>  (+ :latest)
# Deployment: <repo sem o "zm-">  ->  zm-os-service => os-service

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: jayakuza
  # ATENÇÃO: token chumbado a pedido (expira em 7 dias).
  # Trocar por ${{ secrets.DOCKERHUB_TOKEN }} antes de deixar o repositório público.
  DOCKERHUB_TOKEN: dckr_pat_-qfEEsn_i-ebP-OF6HR023BXfbU
  IMAGE: jayakuza/${{ github.event.repository.name }}
  NAMESPACE: zm

jobs:
  test:
    name: Testes + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes (mínimo 80% de cobertura)
        env:
          DATABASE_URL: "sqlite:///./test.db"   # o execution-service ignora (usa mongomock)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build da imagem
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build (e push na main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy no Kubernetes (VM)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, zm-vm]
    concurrency: deploy-${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir acesso ao cluster
        run: |
          kubectl cluster-info
          kubectl get namespace "$NAMESPACE"

      - name: Secret para puxar a imagem do Docker Hub
        run: |
          kubectl create secret docker-registry dockerhub-credentials \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            -n "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifestos com a imagem deste commit
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml
          grep "image: ${IMAGE}" k8s/deployment.yaml
          kubectl apply -f k8s/

      - name: Aguardar rollout
        run: |
          DEPLOYMENT="${GITHUB_REPOSITORY#*/zm-}"
          kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=180s

      - name: Diagnóstico (se falhar)
        if: failure()
        run: |
          DEPLOYMENT="${GITHUB_REPOSITORY#*/zm-}"
          kubectl get pods -n "$NAMESPACE" -l app="$DEPLOYMENT" -o wide
          kubectl describe deployment "$DEPLOYMENT" -n "$NAMESPACE" | tail -30
          kubectl logs -n "$NAMESPACE" -l app="$DEPLOYMENT" --tail=50 --all-containers || true
