# Credenciais de ambiente de estudo (as mesmas do docker-compose).
# O os_user só tem GRANT no schema os_db (ver k8s-infra/mysql).
apiVersion: v1
kind: Secret
metadata:
  name: os-service-sec
  namespace: zm
type: Opaque
stringData:
  DATABASE_URL: "mysql+pymysql://os_user:os_pass@mysql:3306/os_db"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"
