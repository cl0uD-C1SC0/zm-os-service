# os-service: clientes, veículos, OS e ORQUESTRADOR da Saga.
# A tag da imagem é trocada pelo SHA do commit no pipeline (sed no job de deploy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: zm
  labels:
    app: os-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-service
  template:
    metadata:
      labels:
        app: os-service
    spec:
      imagePullSecrets:
        - name: dockerhub-credentials
      # O app roda create_all() ao importar: se o MySQL não responder, o container cai.
      # O Service do mysql só tem endpoint depois do readiness (init.sql concluído).
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do echo "aguardando mysql..."; sleep 2; done
              until nc -z rabbitmq 5672; do echo "aguardando rabbitmq..."; sleep 2; done
      containers:
        - name: os-service
          image: jayakuza/zm-os-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: os-service-cfg
            - secretRef:
                name: os-service-sec
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
