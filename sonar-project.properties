# SonarCloud: https://sonarcloud.io/project/overview?id=cl0uD-C1SC0_zm-os-service
sonar.organization=cl0ud-c1sc0
sonar.projectKey=cl0uD-C1SC0_zm-os-service
sonar.projectName=zm-os-service

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.11

# gerado pelo job "test" (pytest --cov-report=xml) e baixado no job "sonar"
sonar.python.coverage.reportPaths=coverage.xml

# o pipeline espera o Quality Gate: se reprovar, o build e o deploy não rodam
sonar.qualitygate.wait=true

# workflow do CI fora da análise (o token do Docker Hub está chumbado nele, a pedido)
sonar.exclusions=.github/**

# Fora só do cálculo de COBERTURA (continuam sendo analisados para bugs e code smells):
# inicialização, configuração, health check e a camada fina de rotas (só repassa para os services,
# onde a lógica é testada). A trava de 80% do pytest no CI continua medindo o app inteiro.
sonar.coverage.exclusions=app/main.py,app/database.py,app/core/**,app/api/**,app/services/health_service.py,**/__init__.py
